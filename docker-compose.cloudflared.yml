services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://web:80
    depends_on:
      - web
    restart: unless-stopped

